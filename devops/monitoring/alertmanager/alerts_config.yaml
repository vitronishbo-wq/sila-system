# SILA System - Alerting Configuration
# Phase 2.3 - Automated Health Checks

version: "1.0"
alerts:
  # Critical alerts - immediate notification
  critical:
    - name: "backend_down"
      condition: "backend.status == 'unhealthy'"
      severity: "critical"
      message: "Backend API service is down"
      actions:
        - "email"
        - "telegram"
        - "slack"
      cooldown: 300 # 5 minutes

    - name: "database_down"
      condition: "database.status == 'unhealthy'"
      severity: "critical"
      message: "Database service is unavailable"
      actions:
        - "email"
        - "telegram"
      cooldown: 300

    - name: "frontend_down"
      condition: "frontend.status == 'unhealthy'"
      severity: "critical"
      message: "Frontend web service is down"
      actions:
        - "email"
        - "slack"
      cooldown: 300

  # Warning alerts - notify during business hours
  warning:
    - name: "high_cpu_usage"
      condition: "system_resources.cpu.percent > 80"
      severity: "warning"
      message: "CPU usage is above 80%"
      actions:
        - "email"
      cooldown: 1800 # 30 minutes

    - name: "high_memory_usage"
      condition: "system_resources.memory.percent > 85"
      severity: "warning"
      message: "Memory usage is above 85%"
      actions:
        - "email"
      cooldown: 1800

    - name: "low_disk_space"
      condition: "system_resources.disk.percent > 90"
      severity: "warning"
      message: "Disk space is below 10%"
      actions:
        - "email"
        - "telegram"
      cooldown: 3600 # 1 hour

    - name: "slow_response"
      condition: "backend.response_time > 3 or frontend.response_time > 2"
      severity: "warning"
      message: "Service response time is slow"
      actions:
        - "slack"
      cooldown: 900 # 15 minutes

  # Info alerts - log only
  info:
    - name: "service_restart"
      condition: "backend.status changes from 'unhealthy' to 'healthy'"
      severity: "info"
      message: "Backend service has recovered"
      actions:
        - "log"
      cooldown: 60

    - name: "health_check_completed"
      condition: "overall_status.timestamp is recent"
      severity: "info"
      message: "Health check cycle completed"
      actions:
        - "log"

# Alerting channels configuration
channels:
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from_address: "alerts@sila-system.com"
    recipients:
      - "admin@sila-system.com"
      - "devops@sila-system.com"

  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    parse_mode: "HTML"

  slack:
    enabled: true
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#alerts"
    username: "SILA Health Monitor"

  webhook:
    enabled: false
    url: "${CUSTOM_WEBHOOK_URL}"
    headers:
      Authorization: "Bearer ${WEBHOOK_TOKEN}"

# Alert templates
templates:
  critical_alert: |
    🚨 CRITICAL ALERT: {alert_name}
    Message: {message}
    Component: {component}
    Status: {status}
    Time: {timestamp}
    Action Required: Immediate investigation needed!

  warning_alert: |
    ⚠️ WARNING ALERT: {alert_name}
    Message: {message}
    Component: {component}
    Value: {value}
    Threshold: {threshold}
    Time: {timestamp}
    Monitor closely for degradation.

  recovery_alert: |
    ✅ RECOVERY ALERT: {alert_name}
    Message: {message}
    Component: {component}
    Duration: {duration}
    Time: {timestamp}
    Issue has been resolved.

# Monitoring intervals
intervals:
  quick_check: 30 # seconds
  standard_check: 300 # seconds
  detailed_check: 1800 # seconds

# Business hours for alert routing
business_hours:
  enabled: true
  timezone: "America/Sao_Paulo"
  start_hour: 9
  end_hour: 18
  days: ["monday", "tuesday", "wednesday", "thursday", "friday"]

# Alert history and retention
history:
  max_entries: 1000
  retention_days: 30
  enable_rotation: true

# Health check thresholds
thresholds:
  cpu:
    warning: 80
    critical: 95

  memory:
    warning: 85
    critical: 95

  disk:
    warning: 90
    critical: 98

  response_time:
    backend:
      warning: 3.0
      critical: 10.0
    frontend:
      warning: 2.0
      critical: 5.0
    database:
      warning: 1.0
      critical: 5.0

  error_rate:
    warning: 0.05 # 5%
    critical: 0.10 # 10%
