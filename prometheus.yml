# Prometheus Configuration - Fase 18.2

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sila-production'
    environment: 'prod'

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Rule files
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configs
scrape_configs:
  # Prometheus self
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['localhost:9200']
    metrics_path: '/_prometheus/metrics'

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['localhost:9093']

  # Alert Handler
  - job_name: 'alert-handler'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'

  # Logstash
  - job_name: 'logstash'
    static_configs:
      - targets: ['localhost:9600']
    metrics_path: '/_prometheus/metrics'
