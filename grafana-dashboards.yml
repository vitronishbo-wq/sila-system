# Grafana Dashboard Provisioning Configuration - Phase 18.2
# Place in: platform/infrastructure/grafana/provisioning/dashboards/

apiVersion: 1

providers:
  # Security Alerts Dashboard
  - name: 'Security Alerts'
    orgId: 1
    folder: 'Security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/security

  # Anomaly Detection Dashboard
  - name: 'Anomaly Detection'
    orgId: 1
    folder: 'Security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/anomaly

  # Infrastructure Health Dashboard
  - name: 'Infrastructure'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure

  # Elasticsearch Metrics Dashboard
  - name: 'Elasticsearch'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/elasticsearch
