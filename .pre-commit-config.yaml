# Exclusões globais para evitar problemas de permissão
exclude: |
  (?x)^(?:
    .*node_modules/.*|
    .*\.vite/.*|
    .*venv/.*|
    .*\.git/.*|
    .*__pycache__/.*|
    .*\.pytest_cache/.*|
    .*\.cache/.*|
    .*build/.*|
    .*dist/.*|
    .*backup_onboarding/.*|
    .*\.backups/.*
  )

repos:
  # ----------------------
  # Hooks Oficiais
  # ----------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: Validate YAML files
        stages: [pre-commit, commit-msg]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-added-large-files
        args: ["--maxkb=500"]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        files: \.py$
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-json
        files: \.json$
        stages: [pre-commit]
      - id: check-toml
        files: \.toml$
        stages: [pre-commit]

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3.12
        files: \.py$
        args: ["--line-length=88", "--target-version=py312"]
        stages: [pre-commit]

  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        files: \.py$
        args: ["--profile=black", "--check-only", "--diff"]
        stages: [pre-commit]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: \.py$
        args: ["--max-line-length=88", "--extend-ignore=E203,W503,E501"]
        exclude: ^(migrations/|venv/|\.venv/|node_modules/|__pycache__/|build/|dist/)
        additional_dependencies: [flake8-bugbear]
        stages: [pre-commit]

  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(package-lock\.json|yarn\.lock|\.env.*|.*\.lock)$
        files: \.(py|js|ts|tsx|jsx|md|txt|yaml|yml|json|sh|bash)$
        stages: [pre-commit]

  # Documentation and other file formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        files: \.(md|json|yaml|yml)$
        args: ["--prose-wrap=always", "--print-width=88"]
        exclude: ^(node_modules/|package-lock\.json|yarn\.lock|\.env.*)$
        stages: [pre-commit]

  # ----------------------
  # Hooks Locais Personalizados SILA
  # ----------------------
  - repo: local
    hooks:
      - id: check-python-syntax
        name: Check Python Syntax
        entry: python3 scripts/check_python_syntax.py
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit, push]

      - id: validate-structure
        name: Validate Project Structure
        entry: bash automation/validation/structure_guard.sh
        language: system
        files: ^(apps|core|automation|scripts|tools)/
        pass_filenames: false
        stages: [pre-commit, push]

      - id: validate-deps
        name: Validate Python Dependencies
        entry:
          python3 automation/validation/dependency_validator.py --report
          reports/pre-commit/deps_validation.json
        language: system
        files: ^requirements.*\.txt$
        pass_filenames: false
        stages: [pre-commit, push]

      - id: validate-docker
        name: Validate Docker Compose
        entry: bash devops/validate.sh
        language: system
        files: ^(devops|docker)/
        pass_filenames: false
        stages: [pre-commit, push]

      - id: generate-report
        name: Generate Pre-commit Summary Report
        entry: python3 automation/validation/generate_precommit_report.py
        language: system
        pass_filenames: false
        stages: [post-commit]

  # ----------------------
  # YAML and Docker Lint
  # ----------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.31.0
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$
        args: ["-c", ".yamllint"]
        stages: [pre-commit]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        files: Dockerfile$|Dockerfile\.
        stages: [pre-commit]
