name: Test New Modules

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-new-modules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run quality checks
        run: |
          python tests/integration/modules/ci_integration.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests/integration/modules/sanitation tests/integration/modules/justice tests/integration/modules/education -v --cov=modules.sanitation --cov=modules.justice --cov=modules.education --cov-report=xml --cov-fail-under=70.0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: new-modules
          name: new-modules-coverage
