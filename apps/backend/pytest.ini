[pytest]
pythonpath = .
testpaths = 
    tests
    app/modules/financas/tests
    app/modules/identidade_civil/tests
    app/modules/registo_civil/tests

asyncio_mode = auto

markers =
    fuc: Testes de integração com FUC (Ficheiro Único do Cidadão)
    audit: Testes de auditoria imutável
    unittest: Testes unitários puros
    unit: Testes unitários puros
    integration: Testes de integração com BD
    smoke: Testes de smoke (rápidos)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SAWarning

