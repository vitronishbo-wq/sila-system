module: nif
name: Numero de Identificacao Fiscal
code: nif
description: Validacao e consulta de NIF (Numero de Identificacao Fiscal)
type: sub_domain
version: 1.0.0
status: alpha
owner: sila-core
parent: integracao-nacional
exposes:
  api_routers:
  - prefix: /integracao-nacional/nif
    endpoints:
    - POST /integracao-nacional/nif/validar (Validar NIF)
