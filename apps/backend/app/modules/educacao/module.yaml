- step: 2
  description: Encontrar endpoint
  action: Navegue em api_endpoints/files ou siga o mapeamento no catalogo
- step: 3
  description: Encontrar servico de orquestracao
  action: Procure em application_layer/canonical/ para servicos canonicos
- step: 4
  description: Encontrar logica de dominio
  action: Procure em domain_layer/models/ ou domain_layer/entities/
- step: 5
  description: Encontrar persistencia
  action: Procure em infrastructure_layer/repositories/
