stages:
  - audit

architecture:audit_full:
  stage: audit
  image: python:3.12
  allow_failure: false
  before_script:
    - python -m pip install --upgrade pip
    - pip install pyyaml
  script:
    - make audit-full
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
