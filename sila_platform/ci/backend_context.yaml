# Backend Configuration Context
# Used by: scripts/validate_frontend_backend_integration.py --context-file

base_url: "http://localhost:8000"
frontend_url: "http://localhost:5173"

environment: "development"

# API version and prefix (for future routing adjustments)
api_version: "v1"
api_prefix: "/api"

# Timeout and retry configuration
default_timeout_seconds: 8
max_retries: 3

# Health check configuration
health_check:
  endpoint: "/health"
  expected_status: 200
  critical: true

# Authentication configuration
auth:
  endpoint: "/api/auth/login"
  token_header: "Authorization"
  token_prefix: "Bearer"
  critical: true
  # These are test credentials for CI/CD - NOT production!
  test_username: "test@sila.gov.ao"
  test_password: "TestPassword123!"

# CORS configuration for validation
cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:5000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"

# Endpoints to validate (additional to defaults)
additional_endpoints: []

# Performance SLA (Service Level Agreements)
sla:
  health_check_max_ms: 200
  api_response_max_ms: 1000
  p95_max_ms: 2000
  p99_max_ms: 5000

# Features and capabilities
features:
  supports_refresh_token: true
  supports_mfa: false
  supports_oauth2: false
  cors_enabled: true
