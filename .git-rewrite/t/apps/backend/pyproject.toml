[tool.pytest.ini_options]
minversion = "8.0"

# Habilitar todos os markers que você listou
markers = [
    "asyncio: marks tests as async",
    "slow: marks slow tests",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "db: marks database-dependent tests",
    "auth: marks authentication-related tests",
    "unit: marks unit tests",
    "smoke: marks smoke tests",
    "performance: marks performance tests",
    "security: marks security tests",
    "api: marks API tests",
    "ui: marks UI tests",
]

# Configurações úteis
addopts = "--strict-markers --tb=short -W error::DeprecationWarning"

# Ajuste de paths — agora aponta para os diretórios onde estão os testes
testpaths = [
    "backend/app/core/tests",
    "backend/app/modules",
    "scripts/tests"
]

# Reconhecimento de arquivos/classes/funções de teste
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Garantir que backend seja incluído nos imports
pythonpath = ["backend"]

# Controle de warnings
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations/
  | venv/
  | \.venv/
  | __pycache__/
  | node_modules/
  | build/
  | dist/
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]
skip = ["migrations", "__init__.py"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    "migrations",
    "venv",
    ".venv",
    "__pycache__",
    "node_modules",
    "build",
    "dist",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "__pycache__", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_subprocess (common in CLI tools)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/node_modules/*",
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
    "backend/main.py",
    "backend/app.py",
    "backend/create_*",
    "backend/fix_*",
    "backend/verify_*",
    "backend/update_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
skip_empty = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
