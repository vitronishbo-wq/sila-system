# Alembic Configuration File
# This file is part of the Alembic package.

[alembic]
# path to migration scripts
script_location = alembic

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# logging configuration
# IMPORTANT: sqlalchemy.url is set dynamically in env.py
sqlalchemy.url =


# =========================
# LOGGING CONFIGURATION
# =========================

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic


# =========================
# LOGGERS
# =========================

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


# =========================
# HANDLERS
# =========================

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


# =========================
# FORMATTERS
# =========================

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
