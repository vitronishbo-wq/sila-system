# ============================================================================
# SILA System - Docker Compose com Nginx Automático
# Compatível com nginx_automation.sh v2.0
# ============================================================================
#
# USO:
#   docker-compose up -d                          # Iniciar tudo
#   docker-compose ps                             # Ver status
#   docker-compose logs -f                        # Ver logs
#   docker-compose down                           # Parar tudo
#
# NOTAS:
#   - Nginx é gerado e inicializado por nginx_automation.sh
#   - Ou use: docker-compose up -d nginx (após gerar config)
#

version: "3.9"

services:
  # =========================================================================
  # Backend FastAPI
  # =========================================================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/Dockerfile.backend
    container_name: sila-backend
    command: >
      sh -c "
        echo '🚀 Iniciando Backend FastAPI...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      - ./apps/backend:/app:cached
    depends_on:
      - postgres
    networks:
      - sila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # Frontend Vite/React
  # =========================================================================
  frontend:
    image: node:20-alpine
    container_name: sila-frontend
    working_dir: /app
    command: >
      sh -c "
        echo '🚀 Iniciando Frontend Vite...' &&
        if [ ! -d 'node_modules' ]; then
          echo '📦 Instalando dependências...' &&
          npm install
        fi &&
        cd apps/web &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./apps/frontend:/app:cached
    depends_on:
      - backend
    networks:
      - sila-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # Nginx (Gerado por nginx_automation.sh)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: sila-nginx
    ports:
      - "80:80"
      - "9999:9999" # Debug port (dev)
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/frontend/apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sila-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # PostgreSQL Database
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sila-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sila}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sila_dev}
      POSTGRES_DB: ${DB_NAME:-sila_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ensure_databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - sila-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sila}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # Redis Cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: sila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sila-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ============================================================================
# VOLUMES - Persistência de Dados
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# NETWORKS - Comunicação Entre Serviços
# ============================================================================
networks:
  sila-network:
    driver: bridge
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# ⚠️  Se nginx.conf não existe:
#    1. Execute: bash nginx_automation.sh --generate
#    2. Depois: docker-compose up -d
#
# ⚠️  Se nginx não inicia:
#    1. Verifique config: bash nginx_automation.sh --validate-config
#    2. Ver logs: docker logs sila-nginx
#
# ⚠️  Backend não responde em /api/:
#    1. Verificar se backend está rodando: docker ps | grep backend
#    2. Ver logs: docker logs sila-backend
#
# ⚠️  Frontend em branco:
#    1. Verificar console do navegador (F12)
#    2. Limpar cache: Ctrl+Shift+Delete
#    3. Ver logs: docker logs sila-frontend
#
