services:
  db:
    image: postgres:16-alpine
    container_name: sila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sila_db
      POSTGRES_USER: sila_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Truman1*Marcelo1*}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sila_user"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sila-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"

  backend:
    build: ./apps/backend
    container_name: sila-backend
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      ENVIRONMENT: development
      DEBUG: true
      DATABASE_URL: postgresql+asyncpg://sila_user:${POSTGRES_PASSWORD:-Truman1*Marcelo1*}@db:5432/sila_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sila-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_data:
