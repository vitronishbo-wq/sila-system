# ===========================================
# SILA System - Docker Compose Development Override
# Configuração otimizada para desenvolvimento local
# ===========================================

version: "3.8"

services:
  #######################
  # Backend FastAPI (Development)
  #######################
  backend:
    command: >
      sh -c "
        echo '🚀 Iniciando backend em modo development...' &&
        echo '🔥 Modo desenvolvimento - Hot reload ativado' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
      "
    volumes:
      - ../../backend:/app:cached
      - ../../backend/.env.development:/app/.env.development:ro
      - prometheus_data:/tmp/prometheus_metrics
      - backend-logs:/app/logs

  #######################
  # Frontend Web App (Dev Mode - Sem Build)
  #######################
  frontend:
    image: node:20-alpine
    container_name: sila-frontend
    working_dir: /app
    command: >
      sh -c "
        echo '🚀 Iniciando frontend em modo development...' &&
        echo '📦 Verificando dependências...' &&
        if [ ! -d 'node_modules' ]; then
          echo '📥 Instalando dependências...' &&
          npm install
        fi &&
        echo '🔥 Iniciando Vite dev server...' &&
        cd apps/web &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ../../frontend:/app:cached
    depends_on:
      - backend
    networks:
      - sila-network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  #######################
  # Metrics Server (Dev Mode)
  #######################
  metrics:
    image: node:20-alpine
    container_name: sila-metrics
    working_dir: /app
    command: >
      sh -c "
        echo '📊 Iniciando metrics server em modo development...' &&
        node apps/web/metrics-server.js
      "
    ports:
      - "9111:5173"
    environment:
      - NODE_ENV=development
      - METRICS_MODE=true
    volumes:
      - ../../frontend:/app:cached
    depends_on:
      - frontend
      - backend
    networks:
      - sila-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173/metrics",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus_data:
    driver: local
  backend-logs:
    driver: local
  sila-db-data:
    driver: local

networks:
  sila-network:
    driver: bridge
