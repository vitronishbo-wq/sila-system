# ===========================================
# SILA System - Docker Compose Production Override
# Configuração otimizada para produção
# ===========================================

# Carregar variáveis de ambiente de produção
env_file:
  - ../../.env.production

services:
  #######################
  # Backend FastAPI (Production)
  #######################
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: production
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - ENABLE_METRICS=true
      - TELEMETRY_ENABLED=true
    volumes:
      # Apenas volumes necessários para produção (sem código fonte)
      - ../../apps/backend/config/.env.production:/app/.env.production:ro
      - prometheus_data:/tmp/prometheus_metrics
      - backend-logs:/app/logs
    command: ["/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  #######################
  # Frontend (Production Build)
  #######################
  frontend:
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile.smart
      target: runtime
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    ports:
      - "${FRONTEND_PORT:-443}:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  #######################
  # PostgreSQL Database (Production)
  #######################
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    volumes:
      - sila-db-data:/var/lib/postgresql/data

  #######################
  # Redis Cache (Production)
  #######################
  redis:
    command: >
      sh -c "
        if [ -n '${REDIS_PASSWORD}' ]; then
          redis-server --requirepass '${REDIS_PASSWORD}' --maxmemory 256mb
      --maxmemory-policy allkeys-lru
        else
          redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  #######################
  # Monitoring Services (Production)
  #######################
  prometheus:
    image: prom/prometheus:latest
    container_name: sila-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    networks:
      - sila-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: sila-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sila-network
    profiles:
      - monitoring

volumes:
  prometheus_config:
    driver: local
  grafana_data:
    driver: local
