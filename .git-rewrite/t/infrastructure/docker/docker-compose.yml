# ===========================================
# SILA System - Docker Compose Unificado
# Versão: 4.0 - MSIC Compliant (Docker Compose v2)
# ===========================================

# Carregar variáveis de ambiente do ficheiro .env apropriado
# Para desenvolvimento: usar .env.development
# Para produção: usar .env.production
env_file:
  - ../../.env.development # Default para desenvolvimento

services:
  #######################
  # Backend FastAPI
  #######################
  backend:
    profiles:
      - backend
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: sila-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database (usar variáveis do .env)
      - DATABASE_URL=${DATABASE_URL}
      - ASYNC_DATABASE_URL=${ASYNC_DATABASE_URL}

      # Application
      - PYTHONPATH=/app
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8000

      # Security
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}

      # Hot reload para desenvolvimento
      - WATCHFILES_FORCE_POLLING=true

      # Metrics
      - ENABLE_METRICS=true
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_metrics
    volumes:
      # Montar código para hot reload em desenvolvimento
      - ../../backend:/app:cached
      - ../../backend/.env.development:/app/.env.development:ro
      - prometheus_data:/tmp/prometheus_metrics
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo '🚀 Iniciando backend em modo ${ENVIRONMENT:-development}...' &&
        if [ '${ENVIRONMENT:-development}' = 'development' ]; then
          echo '🔥 Modo desenvolvimento - Hot reload ativado' &&
          uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
        else
          echo '🏭 Modo produção - Servidor otimizado' &&
          /entrypoint.sh
        fi
      "

  #######################
  # Frontend Web App
  #######################
  frontend:
    profiles:
      - frontend
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile.smart
      target: ${FRONTEND_TARGET:-runtime}
    container_name: sila-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:5173" # Porta dev Vite
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_BACKEND_URL=http://backend:8000
      - PORT=5173
      - ROLLUP_FORCE_JS=1
    volumes:
      # Montar código para hot reload apenas em desenvolvimento
      - ../../frontend:/app:cached
    depends_on:
      - backend
    networks:
      - sila-network
    healthcheck:
      test: >
        sh -c "
          if [ '${FRONTEND_TARGET:-runtime}' = 'dev' ]; then
            curl -f http://localhost:5173/ || exit 1
          else
            curl -f http://localhost/ || exit 1
          fi
        "
      interval: 30s
      timeout: 10s
      retries: 3

  #######################
  # PostgreSQL Database
  #######################
  db:
    image: postgres:15-alpine
    container_name: sila-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sila_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sila-db-data:/var/lib/postgresql/data
      - ../../backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - sila-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sila_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  #######################
  # Monitoring - Metrics Server
  #######################
  metrics:
    profiles:
      - metrics
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile.smart
      target: metrics
    container_name: sila-metrics
    restart: unless-stopped
    ports:
      - "${METRICS_PORT:-9111}:5173"
    environment:
      - NODE_ENV=development
      - METRICS_MODE=true
    volumes:
      - ../../frontend:/app:cached
    depends_on:
      - frontend
      - backend
    networks:
      - sila-network
    command: ["node", "apps/web/metrics-server.js"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  #######################
  # Redis Cache (Opcional)
  #######################
  redis:
    image: redis:7-alpine
    container_name: sila-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sila-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - cache # Ativar com: docker compose --profile cache up

#######################
# Volumes Persistentes
#######################
volumes:
  sila-db-data:
    driver: local
    name: sila_db_data
  prometheus_data:
    driver: local
    name: sila_prometheus_data
  backend-logs:
    driver: local
    name: sila_backend_logs
  redis-data:
    driver: local
    name: sila_redis_data

#######################
# Networks
#######################
networks:
  sila-network:
    driver: bridge
    name: sila-network
