# SILA System Log Rotation Configuration
# Location: /etc/logrotate.d/sila-system

# SILA Application logs
/opt/sila-system/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        # Signal applications to reopen log files if needed
        echo "SILA application log rotation completed for $(date)" >> /var/log/sila-logrotate.log 2>&1
    endscript
}

# Backend application log
/opt/sila-system/backend/app.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        echo "Backend app log rotation completed for $(date)" >> /var/log/sila-logrotate.log 2>&1
    endscript
}

# Monitoring service logs
/opt/sila-system/monitoring/loki/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        # Restart Loki if running to ensure it picks up any new logs
        if docker ps | grep -q sila-loki; then
            docker restart sila-loki >> /var/log/sila-logrotate.log 2>&1 || true
        fi
        echo "Loki log rotation completed for $(date)" >> /var/log/sila-logrotate.log 2>&1
    endscript
}

# Prometheus logs
/opt/sila-system/monitoring/prometheus/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        # Prometheus handles its own log rotation internally
        echo "Prometheus log rotation completed for $(date)" >> /var/log/sila-logrotate.log 2>&1
    endscript
}

# Grafana logs
/opt/sila-system/monitoring/grafana/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        # Grafana handles its own log rotation
        echo "Grafana log rotation completed for $(date)" >> /var/log/sila-logrotate.log 2>&1
    endscript
}

# Nginx logs (existing configuration)
/var/log/nginx/sila_*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 root root
    postrotate
        if docker ps | grep -q sila-demo-prod; then
            docker exec sila-demo-prod nginx -s reload 2>/dev/null || true
        fi
    endscript
}
