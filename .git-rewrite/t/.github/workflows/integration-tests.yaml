name: Integration Tests (Frontend-Backend)

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run tests every hour
    - cron: "0 * * * *"

env:
  BACKEND_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  PYTHON_VERSION: "3.11"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Test Suite

    services:
      # Database service (PostgreSQL)
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sila_test
          POSTGRES_USER: sila_user
          POSTGRES_PASSWORD: sila_password
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install requests pyyaml matplotlib

      # 4. Setup backend database
      - name: Initialize test database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://sila_user:sila_password@localhost:5432/sila_test
        run: |
          # Run migrations
          python -m alembic upgrade head 2>/dev/null || true
          # Seed test data
          python init_db.py || true

      # 5. Start backend server
      - name: Start backend server
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://sila_user:sila_password@localhost:5432/sila_test
          ENVIRONMENT: test
          DEBUG: "false"
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "Backend PID: $!"

          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend... (attempt $i/30)"
            sleep 1
          done

          if [ $i -eq 30 ]; then
            echo "Backend failed to start"
            cat backend.log
            exit 1
          fi

      # 6. Setup Node.js and start frontend (optional)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "apps/frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build || echo "Frontend build skipped"

      - name: Start frontend dev server
        working-directory: apps/frontend
        run: |
          npm run dev > frontend.log 2>&1 &
          echo "Frontend PID: $!"

          # Wait for frontend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            echo "Waiting for frontend... (attempt $i/30)"
            sleep 1
          done

      # 7. Get test token for authentication
      - name: Generate test authentication token
        id: auth
        run: |
          set +e  # Don't fail if token generation fails
          TOKEN=$(bash scripts/get_dev_token.sh 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
            echo "Token generated successfully"
          else
            echo "Using anonymous token (no auth)"
          fi

      # 8. Run integration tests
      - name: Run integration validation tests
        id: integration_test
        continue-on-error: true
        run: |
          python scripts/validate_frontend_backend_integration.py \
            --backend-url ${{ env.BACKEND_URL }} \
            --frontend-url ${{ env.FRONTEND_URL }} \
            --context ci/backend_context.yaml \
            --endpoints ci/endpoints.yaml \
            --timeout 15 \
            --workers 4 \
            --output-dir ./integration_results \
            --format json,markdown,html \
            $( [ -n "${{ steps.auth.outputs.token }}" ] && echo "--auth-token ${{ steps.auth.outputs.token }}" || echo "" )

      # 9. Parse results
      - name: Parse test results
        id: results
        if: always()
        run: |
          if [ -f "./integration_results/integration_results.json" ]; then
            TOTAL=$(jq '.summary.total' ./integration_results/integration_results.json)
            PASSED=$(jq '.summary.passed' ./integration_results/integration_results.json)
            FAILED=$(jq '.summary.failed' ./integration_results/integration_results.json)
            CRITICAL_FAILED=$(jq '.summary.critical_failed' ./integration_results/integration_results.json)

            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "critical_failed=$CRITICAL_FAILED" >> $GITHUB_OUTPUT

            echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Endpoints | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| 🚨 Critical Failed | $CRITICAL_FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      # 10. Comment on PR with results
      - name: Comment results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('./integration_results/integration_results.json', 'utf8'));
              const markdown = fs.readFileSync('./integration_results/integration_results.md', 'utf8');

              let comment = `## 🔗 Integration Test Results\n\n`;
              comment += `**Summary:**\n`;
              comment += `- Total: ${results.summary.total}\n`;
              comment += `- ✅ Passed: ${results.summary.passed}\n`;
              comment += `- ❌ Failed: ${results.summary.failed}\n`;
              comment += `- 🚨 Critical Failed: ${results.summary.critical_failed}\n\n`;

              if (results.summary.failed > 0) {
                comment += `### ⚠️ Failed Endpoints\n`;
                const failed = results.endpoints.filter(ep => ep.status === 'FAIL');
                for (const ep of failed.slice(0, 5)) {
                  comment += `- **${ep.name}** (${ep.method} ${ep.url}): ${ep.error}\n`;
                }
                if (failed.length > 5) {
                  comment += `- ... and ${failed.length - 5} more\n`;
                }
              } else {
                comment += `### ✅ All tests passed!\n`;
              }

              comment += `\n[📊 View Full Report](../actions/runs/${{ github.run_id }})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not parse results:', error);
            }

      # 11. Upload artifacts
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: integration_results/
          retention-days: 30

      # 12. Upload logs
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-logs
          path: apps/backend/backend.log
          retention-days: 7

      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-logs
          path: apps/frontend/frontend.log
          retention-days: 7

      # 13. Fail job if critical endpoints failed
      - name: Check critical test status
        if: always()
        run: |
          if [ -f "./integration_results/integration_results.json" ]; then
            CRITICAL_FAILED=$(jq '.summary.critical_failed' ./integration_results/integration_results.json)
            if [ "$CRITICAL_FAILED" -gt 0 ]; then
              echo "❌ Critical endpoints failed: $CRITICAL_FAILED"
              exit 1
            else
              echo "✅ All critical endpoints passed"
            fi
          else
            echo "⚠️ No results file found"
            exit 1
          fi

  # Optional: Slack notification
  notify:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always() && env.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          text: |
            Integration Tests: ${{ job.status }}
            Ref: ${{ github.ref }}
            Commit: ${{ github.sha }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        if: always()
