name: Code Index Generator

on:
  push:
    branches: [main, develop, dev]
  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies (none required)
        run: |
          python -m pip install --upgrade pip
          # If master_index_generator.py ever needs deps, install here

      - name: Generate full index (TXT + JSON + CSV)
        run: |
          chmod +x ./master-index.sh
          ./master-index.sh full --csv --json

      - name: Upload index artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-index-${{ github.run_id }}
          path: |
            all_code_index.txt
            all_code_index.csv
            all_code_index.json
          retention-days: 14

      - name: Comment summary on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('all_code_index.txt', 'utf8').split('\n').slice(0, 10).join('\n');
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `📂 **Code Index regenerated**\n\n\n\`\`\`\n${lines}\n\`\`\`\nFull artifacts uploaded to workflow run.`
            });
