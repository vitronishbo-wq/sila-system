name: Configuration Validation

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run configuration validation daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to validate"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production
          - test
      strict_mode:
        description: "Enable strict mode (warnings become errors)"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  validate-config:
    name: Validate Configuration
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [development, staging, production, test]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements/dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Create virtual environment
        run: |
          cd apps/backend
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          cd apps/backend
          source venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements/dev.txt

      - name: Install Node.js dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Create environment file
        run: |
          cd apps/backend
          # Create .env file for testing
          cat > .env << EOF
          PROJECT_NAME=SILA System
          VERSION=1.0.0
          ENVIRONMENT=${{ matrix.environment }}
          DEBUG=true
          SECRET_KEY=test-secret-key-for-ci-cd-validation-32-chars-long
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password_123
          POSTGRES_DB=test_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          REDIS_PASSWORD=
          REDIS_DB=0
          REDIS_MAX_CONNECTIONS=20
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          PASSWORD_HASH_ALGORITHM=bcrypt
          PASSWORD_MIN_LENGTH=8
          SESSION_TIMEOUT_MINUTES=60
          SESSION_COOKIE_SECURE=false
          DATABASE_POOL_SIZE=10
          DATABASE_MAX_OVERFLOW=20
          DATABASE_ECHO=false
          TELEMETRY_ENABLED=true
          LOG_LEVEL=INFO
          CORS_ENABLED=true
          ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
          ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
          ALLOWED_HEADERS=*
          RATE_LIMIT_ENABLED=true
          RATE_LIMIT_PER_MINUTE=60
          RATE_LIMIT_BURST=10
          RATE_LIMIT_STORAGE=redis
          MAX_UPLOAD_SIZE=10485760
          ALLOWED_EXTENSIONS=jpg,jpeg,png,pdf,doc,docx,txt
          UPLOAD_PATH=./uploads
          FEATURE_MONITORING=true
          FEATURE_BACKUP=true
          FEATURE_AUTO_HEALER=true
          FEATURE_AUDIT_LOG=true
          FEATURE_EMAIL_NOTIFICATIONS=false
          FEATURE_FILE_STORAGE=true
          SECURITY_HEADERS_ENABLED=true
          SECURITY_HSTS_MAX_AGE=31536000
          SECURITY_CONTENT_TYPE_NOSNIFF=true
          SECURITY_X_FRAME_OPTIONS=DENY
          SECURITY_CONTENT_SECURITY_POLICY=default-src 'self'
          PROMETHEUS_ENABLED=false
          PROMETHEUS_PORT=9090
          PROMETHEUS_GATEWAY=http://localhost:9090
          JAEGER_ENABLED=false
          JAEGER_ENDPOINT=http://localhost:14268
          JAEGER_SERVICE_NAME=sila-backend
          GRAFANA_ENABLED=false
          GRAFANA_URL=http://localhost:3000
          GRAFANA_USERNAME=admin
          GRAFANA_PASSWORD=admin
          BNA_API_KEY=test-bna-api-key
          BNA_API_URL=https://api.bna.ao
          BNA_ENVIRONMENT=sandbox
          BNA_TIMEOUT=30
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USERNAME=
          SMTP_PASSWORD=
          SMTP_USE_TLS=true
          SMTP_USE_SSL=false
          STORAGE_BACKEND=minio
          MINIO_ENDPOINT=localhost:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_SECURE=false
          MINIO_BUCKET_NAME=sila-storage
          EOF

      - name: Validate configuration (${{ matrix.environment }})
        run: |
          cd backend
          source venv/bin/activate

          # Run configuration validation
          python scripts/validate_config.py \
            --environment ${{ matrix.environment }} \
            --output text

      - name: Validate configuration (JSON output)
        run: |
          cd backend
          source venv/bin/activate

          # Run validation and save JSON output
          python scripts/validate_config.py \
            --environment ${{ matrix.environment }} \
            --output json \
            > validation-results-${{ matrix.environment }}.json

          # Display results summary
          echo "## Validation Results for ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat validation-results-${{ matrix.environment }}.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results-${{ matrix.environment }}
          path: backend/validation-results-${{ matrix.environment }}.json
          retention-days: 30

      - name: Test configuration migration
        run: |
          cd backend
          source venv/bin/activate

          # Test migration tool in dry-run mode
          echo "Testing configuration migration tool..."
          python config/migrate_config.py --dry-run > migration-report.txt

          # Display migration summary
          echo "## Migration Report for ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 migration-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload migration report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-report-${{ matrix.environment }}
          path: backend/migration-report.txt
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        run: |
          cd backend
          bandit -r config/ -f json -o bandit-report.json || true
          bandit -r config/ -f txt

      - name: Run Safety check
        run: |
          cd backend
          safety check --json --output safety-report.json || true
          safety check

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json
          retention-days: 30

  performance-test:
    name: Configuration Performance Test
    runs-on: ubuntu-latest
    needs: validate-config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Create test environment
        run: |
          cd backend
          cat > .env << EOF
          ENVIRONMENT=production
          DEBUG=false
          SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password_123
          POSTGRES_DB=test_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          DATABASE_POOL_SIZE=20
          DATABASE_MAX_OVERFLOW=40
          REDIS_MAX_CONNECTIONS=50
          RATE_LIMIT_PER_MINUTE=120
          EOF

      - name: Performance benchmark
        run: |
          cd backend
          python -c "
          import time
          import sys
          sys.path.insert(0, '.')

          from config import get_settings, validate_configuration

          # Benchmark settings loading
          times = []
          for i in range(100):
              start = time.perf_counter()
              settings = get_settings()
              end = time.perf_counter()
              times.append(end - start)

          avg_time = sum(times) / len(times)
          max_time = max(times)
          min_time = min(times)

          print(f'Configuration Loading Performance:')
          print(f'  Average: {avg_time*1000:.3f}ms')
          print(f'  Maximum: {max_time*1000:.3f}ms')
          print(f'  Minimum: {min_time*1000:.3f}ms')

          # Performance thresholds
          if avg_time > 0.001:  # 1ms
              print('❌ Average loading time exceeds 1ms threshold')
              sys.exit(1)
          else:
              print('✅ Performance benchmarks passed')

          # Benchmark validation
          start = time.perf_counter()
          is_valid, errors, warnings = validate_configuration()
          end = time.perf_counter()

          validation_time = end - start
          print(f'Validation time: {validation_time*1000:.3f}ms')

          if validation_time > 0.01:  # 10ms
              print('❌ Validation time exceeds 10ms threshold')
              sys.exit(1)
          else:
              print('✅ Validation performance passed')
          "

  integration-test:
    name: Configuration Integration Test
    runs-on: ubuntu-latest
    needs: validate-config

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Create integration test environment
        run: |
          cd backend
          cat > .env << EOF
          ENVIRONMENT=staging
          DEBUG=false
          SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password_123
          POSTGRES_DB=test_db
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          REDIS_URL=redis://localhost:6379/0
          REDIS_PASSWORD=
          REDIS_DB=0
          DATABASE_POOL_SIZE=5
          DATABASE_MAX_OVERFLOW=10
          REDIS_MAX_CONNECTIONS=20
          EOF

      - name: Run integration tests
        run: |
          cd backend
          python -c "
          import sys
          sys.path.insert(0, '.')

          print('Running configuration integration tests...')

          # Test 1: Basic configuration loading
          try:
              from config import settings, get_config_manager
              print('✅ Configuration imports successful')
          except Exception as e:
              print(f'❌ Import failed: {e}')
              sys.exit(1)

          # Test 2: Settings validation
          try:
              from config import validate_configuration
              is_valid, errors, warnings = validate_configuration()
              if not is_valid:
                  print(f'❌ Configuration validation failed: {errors}')
                  sys.exit(1)
              print('✅ Configuration validation passed')
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)

          # Test 3: Configuration manager
          try:
              manager = get_config_manager()
              summary = manager.get_config_summary()
              if not summary:
                  print('❌ Configuration manager failed')
                  sys.exit(1)
              print('✅ Configuration manager working')
          except Exception as e:
              print(f'❌ Manager error: {e}')
              sys.exit(1)

          # Test 4: Environment switching
          try:
              original_env = settings.ENVIRONMENT
              test_settings = manager.switch_environment('test')
              if test_settings.ENVIRONMENT != 'test':
                  print('❌ Environment switching failed')
                  sys.exit(1)
              manager.switch_environment(original_env)
              print('✅ Environment switching working')
          except Exception as e:
              print(f'❌ Environment switching error: {e}')
              sys.exit(1)

          # Test 5: File operations
          try:
              import tempfile
              import os

              with tempfile.NamedTemporaryFile(mode='w', suffix='.json', delete=False) as f:
                  config_path = f.name

              manager.save_to_file(config_path, include_secrets=False)
              loaded_settings = manager.load_from_file(config_path)

              os.unlink(config_path)
              print('✅ File operations working')
          except Exception as e:
              print(f'❌ File operations error: {e}')
              sys.exit(1)

          print('🎉 All integration tests passed!')
          "

  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [validate-config, security-scan, performance-test, integration-test]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create summary report
        run: |
          echo "# Configuration Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each job status
          if [ "${{ needs.validate-config.result }}" == "success" ]; then
            echo "✅ Configuration Validation: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Configuration Validation: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ Security Scan: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security Scan: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.performance-test.result }}" == "success" ]; then
            echo "✅ Performance Test: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Performance Test: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.integration-test.result }}" == "success" ]; then
            echo "✅ Integration Test: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Integration Test: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Validation results for each environment" >> $GITHUB_STEP_SUMMARY
          echo "- Migration reports" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan reports" >> $GITHUB_STEP_SUMMARY
