name: Cleanup CI (Lote 1)

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/cleanup_ci.yml'
  workflow_dispatch:
    # allow manual runs via UI or API
    inputs: {}
  workflow_dispatch: {}

concurrency:
  group: cleanup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-check:
    name: Validate (lint + import-check)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - name: Checkout
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: |
          set -euo pipefail
          ruff check backend

      - name: Type-check with mypy
        run: |
          set -euo pipefail
          if [ -d backend ]; then
            python -m mypy backend || true
          else
            echo "No backend/ directory, skipping mypy"
          fi

      - name: Import-check (stubs compatibility)
        run: |
          set -euo pipefail
          PYTHONPATH=backend python - <<'PY'
          import importlib, sys
          names = [
            'backend.modules.address',
            'backend.modules.appointments',
            'backend.modules.auth',
            'backend.modules.citizenship',
            'backend.modules.commercial',
          ]
          failed = []
          for n in names:
              try:
                  importlib.import_module(n)
                  print(n, 'OK')
              except Exception as e:
                  print(n, 'IMPORT ERROR:', type(e).__name__, e)
                  failed.append((n, str(e)))
          if failed:
              print('\nImport-check failed for the following modules:')
              for f, msg in failed:
                  print(f, msg)
              raise SystemExit(1)
          print('\nImport-check passed')
          PY

  unit-tests:
    name: Unit tests (smoke, non-integration)
    runs-on: ubuntu-latest
    needs: validate-check
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - name: Checkout
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (minimal)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else echo "No backend/requirements.txt found"; fi

      - name: Run unit tests (exclude integration)
        run: |
          set -euo pipefail
          PYTHONPATH=backend python -m pytest -q -k "not integration" --junitxml=pytest-results.xml --cov=backend --cov-report=xml:coverage.xml

      - name: Upload pytest results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit against requirements (if exists)
        run: |
          set -euo pipefail
          if [ -f backend/requirements.txt ]; then pip-audit -r backend/requirements.txt || true; else echo "No backend/requirements.txt to audit"; fi

  frontend:
    name: Frontend validation (eslint, build)
    runs-on: ubuntu-latest
    needs: validate-check
    steps:
      - name: Checkout
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check for frontend/package.json
        id: check_frontend
        run: |
          if [ -f frontend/package.json ]; then echo "has_frontend=true" > result.txt; else echo "has_frontend=false" > result.txt; fi
          cat result.txt
          echo "frontend_exists=$(cat result.txt | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Install frontend deps (if present)
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          set -euo pipefail
          cd frontend
          npm ci

      - name: Cache npm
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Lint frontend (eslint)
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          set -euo pipefail
          cd frontend
          npx eslint . --max-warnings=0

      - name: Build frontend (optional)
        if: steps.check_frontend.outputs.frontend_exists == 'true'
        run: |
          set -euo pipefail
          cd frontend
          if [ -f package.json ] && grep -q "build" package.json; then npm run build || true; else echo "no build script"; fi
