version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🔧 npm"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "🐍 pip"
      include: "scope"
# Notes:
# - Adjust 'directory' paths if your frontend is at a different location (e.g. /frontend)
# - Set interval to 'daily' if you prefer faster updates; weekly reduces noise
