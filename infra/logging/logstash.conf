# Logstash Pipeline para SILA - Fase 18.1
# Processa eventos auditáveis do Event Bus e repositórios

input {
  tcp {
    port => 5000
    codec => json
  }
  
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # 1. Verificação básica
  if [message] == "" {
    drop { }
  }
  
  # 2. Parse JSON da mensagem se necessário
  if [message] {
    json {
      source => "message"
      target => "parsed_log"
      skip_on_invalid_json => true
    }
  }
  
  # 3. Normalizar estrutura de evento
  mutate {
    remove_field => [ "host", "[agent][version]", "[agent][name]" ]
  }
  
  # 4. Extrair campos críticos de auditoria
  if [parsed_log] {
    mutate {
      add_field => {
        "event_name" => "%{[parsed_log][event_name]}"
        "actor_id" => "%{[parsed_log][actor_id]}"
        "status" => "%{[parsed_log][status]}"
        "timestamp" => "%{[parsed_log][timestamp]}"
        "user_id" => "%{[parsed_log][user_id]}"
        "tenant_id" => "%{[parsed_log][tenant_id]}"
        "roles" => "%{[parsed_log][roles]}"
        "request_id" => "%{[parsed_log][request_id]}"
        "trace_id" => "%{[parsed_log][trace_id]}"
        "span_id" => "%{[parsed_log][span_id]}"
        "action" => "%{[parsed_log][action]}"
        "resource" => "%{[parsed_log][resource]}"
        "resource_id" => "%{[parsed_log][resource_id]}"
        "session_id" => "%{[parsed_log][session_id]}"
        "subject_id" => "%{[parsed_log][subject_id]}"
        "event_type" => "%{[parsed_log][event_type]}"
      }
    }
  }
  
  # 5. Normalizar timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }
  
  # 6. Adicionar timestamp padrão se não houver
  if ![timestamp] {
    mutate {
      add_field => {
        "@timestamp" => "%{@timestamp}"
      }
    }
  }
  
  # 7. Detecção de eventos de auditoria
  if [action] or [event_name] {
    mutate {
      add_tag => [ "audit_event" ]
      add_field => {
        "audit.action" => "%{[action]}"
        "audit.resource" => "%{[resource]}"
        "audit.entity_id" => "%{[resource_id]}"
      }
    }
  }
  
  # 8. Detecção de eventos de login
  if [action] == "UPDATE_LOGIN" or [action] == "LOGIN_SUCCESS" {
    mutate {
      add_tag => [ "login_event" ]
    }
  }
  
  # 9. Detecção de eventos de falha
  if [action] == "INCREMENT_FAILED" or "failed" in [message] {
    mutate {
      add_tag => [ "failure_event" ]
    }
  }
  
  # 10. Detecção de eventos de revogação
  if [action] == "REVOKE" or [action] == "REVOKE_ALL" {
    mutate {
      add_tag => [ "revocation_event" ]
    }
  }
  
  # 11. Enriquecimento com geo-IP (se houver IP)
  if [source_ip] {
    geoip {
      source => "source_ip"
      target => "geoip"
      fields => [ "country_name", "region_name", "city_name", "timezone" ]
    }
  }
  
  # 12. Normalizar roles (converter para array se necessário)
  if [roles] and [roles] != "-" {
    mutate {
      gsub => [ "roles", "'", "" ]
    }
  }
  
  # 13. Adicionar metadados do pipeline
  mutate {
    add_field => {
      "pipeline" => "sila-audit-v1"
      "ingest_timestamp" => "%{@timestamp}"
    }
  }
  
  # 14. Fingerprint para evitar duplicatas
  fingerprint {
    source => [ "request_id", "event_name", "action", "resource" ]
    target => "fingerprint"
    method => "SHA1"
    concatenate_sources => true
  }
}

output {
  # Output 1: Elasticsearch Principal
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "sila-audit-%{+YYYY.MM.dd}"
    document_id => "%{fingerprint}"
    codec => json
    document_type => "_doc"
    manage_template => true
    template_name => "sila-audit"
    template_overwrite => true
    template => "/usr/share/logstash/templates/sila-audit-template.json"
  }
  
  # Output 2: Log em arquivo (backup)
  file {
    path => "/var/log/logstash/sila-audit-%{+YYYY-MM-dd}.log"
    codec => json_lines
  }
  
  # Output 3: Console (debug)
  stdout {
    codec => rubydebug
  }
}
