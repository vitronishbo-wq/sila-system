apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: obras-publicas-outbox-worker-hpa
  namespace: sila-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: obras-publicas-outbox-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: op_outbox_pending_batch_size
        target:
          type: AverageValue
          averageValue: "25"
