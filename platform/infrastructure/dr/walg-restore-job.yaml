apiVersion: batch/v1
kind: Job
metadata:
  name: op-postgres-walg-restore
  namespace: sila-system
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wal-g-restore
          image: ghcr.io/wal-g/wal-g:latest
          command:
            - /bin/sh
            - -ec
            - |
              wal-g backup-fetch /var/lib/postgresql/data LATEST
          env:
            - name: WALG_S3_PREFIX
              value: s3://gov-backup/op
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sila-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sila-secrets
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: sila-postgres-pvc
