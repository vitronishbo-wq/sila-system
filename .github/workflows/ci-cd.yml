---
name: CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: sila-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sila_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sila_test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache pip and venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key:
            ${{ runner.os }}-pip-${{ hashFiles('.sila_installer/requirements.txt')
            }}-3.12
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('.sila_installer/requirements.txt') }}-

      - name: Install dependencies with Smart Installer (retry)
        run: |
          set -euo pipefail
          retry() { n=0; until [ "$n" -ge 3 ]; do "$@" && break || n=$((n+1)); sleep $((n*2)); done; }
          python -m pip install --upgrade pip
          retry pip install -r .sila_installer/requirements.txt
          # Optional: only if these scripts exist
          if [ -f .sila_installer/scripts/sila_dependency_auditor.py ]; then python .sila_installer/scripts/sila_dependency_auditor.py; fi
          if [ -f .sila_installer/scripts/smart_installer.py ]; then python .sila_installer/scripts/smart_installer.py; fi
          if [ -f .sila_installer/scripts/ci_integration.py ]; then python .sila_installer/scripts/ci_integration.py; fi

      - name: Wait for Postgres to be ready
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres -t 1; do
            echo "waiting for postgres..."
            sleep 1
          done

      - name: Run migrations (retry)
        run: |
          cd apps/backend
          retry() { n=0; until [ "$n" -ge 3 ]; do "$@" && break || n=$((n+1)); sleep $((n*2)); done; }
          retry alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd apps/backend
          pip install pytest-cov
          pytest tests/ -v \
            --cov=modules \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (for push)
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image (Buildx)
        uses: docker/build-push-action@v4
        with:
          context: ./apps/backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload test artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            apps/backend/*.xml
            apps/backend/.pytest_cache
            apps/backend/tests/**/*.log

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.13.1
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Gosec Security Scanner
        uses: securecodewarrior/github-action-gosec@v1.0.2
        with:
          args: "./..."

      - name: Detect secrets with GitLeaks
        uses: zricethezav/gitleaks-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy-dev:
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to DEV (via SSH action)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sila-system
            git pull origin develop
            docker-compose down || true
            docker-compose up -d

  deploy-prod:
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Production Environment (via SSH action)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/sila-system
            python3 apps/backend/env_validator.py

      - name: Deploy to PROD (via SSH action)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/sila-system
            git pull origin main
            docker-compose down || true
            docker-compose up -d

      - name: Post-Deploy Health Check
        run: |
          for i in 1 2 3; do curl -f --retry 3 --retry-delay 5 -sS http://${{ secrets.PROD_HOST }}/health && exit 0 || sleep 10; done
          exit 1
