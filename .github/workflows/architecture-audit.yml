name: Architecture Audit

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  audit-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run architecture full audit
        run: make audit-full
