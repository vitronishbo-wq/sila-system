name: Verify AGENT_RULES

on:
  push:
    paths:
      - 'AGENT_RULES.md'
  pull_request:
    paths:
      - 'AGENT_RULES.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AGENT_RULES verification
        run: |
          python3 scripts/verify_agent_rules.py
