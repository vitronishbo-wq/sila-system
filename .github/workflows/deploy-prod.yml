name: Deploy Ambiente Produção

on:
  push:
    tags:
      - 'v*-prod'
      - 'v*-production'
  release:
    types: [published]
  workflow_dispatch:  # Permite deploy manual

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production  # Requer aprovação se configurado

    steps:
      - name: Checkout do código
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Configurar Docker Buildx
  uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Logar no Docker Hub (opcional)
        if: secrets.DOCKER_USERNAME
  uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y git curl wget

      - name: Verificar instalação do Docker
        run: docker --version

      - name: Executar deploy no ambiente produção
        run: |
          chmod +x ./deploy_multi_ambiente_ci.sh
          ./deploy_multi_ambiente_ci.sh --ci-mode --env=prod
        env:
          GITHUB_ACTIONS: true
          CI: true

      - name: Upload dos logs como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-prod-${{ github.run_id }}
          path: |
            logs/deploy_prod_*.log
            backups/prod_backup_*.tar.gz
          retention-days: 30

      - name: Notificação de deploy (opcional)
        if: success()
        run: |
          echo "🎉 Deploy de produção realizado com sucesso!"
          echo "📦 Versão: $(cat VERSION.txt 2>/dev/null || echo 'desconhecida')"
          echo "🌍 Ambiente: produção"
          echo "⏰ Data/Hora: $(date)"
