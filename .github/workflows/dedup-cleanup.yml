name: Safe Duplicate Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no deletions, logging only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/dedup-cleanup.yml"
      - ".github/scripts/safe_dedup.py"

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint pytest

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run safe deduplication script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running in DRY-RUN mode (no deletions)."
            python .github/scripts/safe_dedup.py --dry-run
          else
            echo "Running in NORMAL mode (backed-up deletions enabled)."
            python .github/scripts/safe_dedup.py
          fi

      - name: Run lint
        run: |
          pylint $(git ls-files '*.py')

      - name: Run tests
        run: |
          pytest -q

      - name: Rollback if failures
        if: failure()
        run: |
          echo "Restoring backup from .cleanup_backup..."
          if [ -d ".cleanup_backup" ]; then
            cp -r .cleanup_backup/* . || true
          else
            echo "No .cleanup_backup directory found; nothing to restore."
          fi

      - name: Commit cleanup
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git status
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'cleanup: automated duplicate removal (CI-verified)'
            git push
          fi
