name: Indexes and Quick CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  update-indexes:
    name: Update indexes and run quick tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/base.txt ]; then pip install -r requirements/base.txt; fi
          pip install pytest

      - name: Run update-indexes
        run: |
          make update-indexes

      - name: Run quick tests (exclude e2e)
        env:
          PYTHONPATH: .
        run: |
          # Prefer to avoid heavy E2E runs on PRs; exclude tests marked as e2e
          python -m pytest -q -k "not e2e" --maxfail=1

      - name: Upload index artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indexes
          path: |
            docs/tree.json
            docs/tree.md
            docs/modules/tree.modules.json
            docs/modules/tree.modules.txt
            reports/daily_audit.json
            reports/daily_audit.md
