name: Deploy Ambiente Dev

on:
  push:
    branches:
      - dev
      - develop
  pull_request:
    branches:
      - dev
      - develop

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
  uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Configurar Docker Buildx
  uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Logar no Docker Hub (opcional)
        if: secrets.DOCKER_USERNAME
  uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y git curl wget

      - name: Verificar instalação do Docker
        run: docker --version

      - name: Executar deploy no ambiente dev
        run: |
          chmod +x ./deploy_multi_ambiente_ci.sh
          ./deploy_multi_ambiente_ci.sh --ci-mode --env=dev
        env:
          GITHUB_ACTIONS: true
          CI: true

      - name: Rodar smoke test de login (/auth/login)
        run: |
          chmod +x automation/testing/smoke_login.sh
          bash automation/testing/smoke_login.sh
        env:
          HOST: http://localhost:8000

      - name: Upload dos logs como artefato
        if: always()
  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-dev-${{ github.run_id }}
          path: |
            logs/deploy_dev_*.log
            backups/dev_backup_*.tar.gz
          retention-days: 7

      - name: Comentário no PR (se aplicável)
        if: github.event_name == 'pull_request'
  uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deploy de desenvolvimento executado com sucesso!\n\n📋 Status: ✅ Concluído\n🌍 Ambiente: dev\n📦 Versão: Ver logs para detalhes\n🔗 [Ver workflow](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ')'
            })
