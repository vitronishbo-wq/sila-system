[pytest]
minversion = 8.0
addopts = -ra -q --ignore=scripts/test_critical_routes.py
testpaths =
    tests
pythonpath = .:scripts:apps/backend

markers =
    external: tests that depend on external APIs or services
    slow: marks tests as slow
    integration: integration tests
    e2e: end-to-end tests
    db: tests that require database access

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
